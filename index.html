<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <title>Livro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #202020 0%, #111111 55%, #080808 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: default;
        }

        .pagina {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .livro {
            position: relative;
            width: 250px;
            height: 330px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.25s ease;
            filter: drop-shadow(0 30px 35px rgba(0, 0, 0, 0.75));
        }

        .livro:hover {
            transform: translateY(-8px) rotateX(3deg) rotateY(-3deg);
        }

        .capa {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(90deg, #542d18 0%, #754323 8%, #6b391d 50%, #522b18 92%, #3c2114 100%);
            border: 7px solid #2b1a11;
            border-radius: 5px 10px 10px 5px;
            box-shadow:
                inset 7px 0 0 rgba(255,255,255,0.05),
                inset -10px 0 0 rgba(0,0,0,0.2);
            transform-style: preserve-3d;
            transform-origin: left center;
            transition:
                transform 1s cubic-bezier(.65,0,.35,1),
                box-shadow 0.5s ease;
            z-index: 4;
        }

        .livro.aberto .capa {
            transform: rotateY(-155deg);
            box-shadow:
                -15px 15px 20px rgba(0,0,0,0.45);
        }

        .capa::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 4px solid #3a2114;
            border-radius: 3px;
            box-shadow:
                inset 0 0 0 2px rgba(139, 83, 42, 0.25);
        }

        .capa::after {
            content: "";
            position: absolute;
            left: 25px;
            right: 25px;
            top: 28px;
            bottom: 28px;
            border: 2px solid rgba(40, 21, 12, 0.55);
            border-radius: 2px;
        }

        .titulo-livro {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #d7b57a;
            font-family: "Poppins", sans-serif;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            width: 180px;
            text-shadow:
                2px 2px 0 #24150d,
                3px 3px 0 rgba(0,0,0,0.5);
            z-index: 3;
        }

        .miolo {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #d8c69c;
            border: 6px solid #392416;
            border-radius: 5px 10px 10px 5px;
            box-shadow:
                inset 0 0 25px rgba(74, 49, 25, 0.28);
            z-index: 1;
        }

        .miolo::before {
            content: "";
            position: absolute;
            inset: 15px;
            border: 1px solid rgba(78, 52, 28, 0.25);
        }

        .miolo::after {
            content: "";
            position: absolute;
            left: 30px;
            right: 30px;
            top: 50px;
            height: 2px;
            background: rgba(76, 51, 28, 0.18);
            box-shadow:
                0 28px 0 rgba(76, 51, 28, 0.18),
                0 56px 0 rgba(76, 51, 28, 0.18),
                0 84px 0 rgba(76, 51, 28, 0.18),
                0 112px 0 rgba(76, 51, 28, 0.18),
                0 140px 0 rgba(76, 51, 28, 0.18),
                0 168px 0 rgba(76, 51, 28, 0.18),
                0 196px 0 rgba(76, 51, 28, 0.18);
        }

        .marcador {
            position: absolute;
            width: 25px;
            height: 105px;
            right: -9px;
            top: 55px;
            background: #cebd06;
            border-radius: 2px 3px 3px 2px;
            z-index: 5;
            box-shadow: 2px 3px 4px rgba(0,0,0,0.35);
        }

        .marcador::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 12.5px solid transparent;
            border-right: 12.5px solid transparent;
            border-bottom: 15px solid #d8c69c;
        }

        .sombra {
            position: absolute;
            width: 290px;
            height: 45px;
            bottom: -65px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            filter: blur(20px);
            border-radius: 50%;
            transition: all 0.7s ease;
        }

        .livro:hover .sombra {
            width: 250px;
            opacity: 0.4;
        }

        .livro.aberto {
            cursor: default;
        }

        .livro.aberto:hover {
            transform: none;
        }

        .livro.aberto .marcador {
            opacity: 0;
        }

        @media (max-width: 600px) {
            .livro {
                width: 210px;
                height: 280px;
            }

            .titulo-livro {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>
    <main class="pagina">
        <div class="livro" id="livro">
            <div class="sombra"></div>

            <div class="miolo"></div>

            <div class="capa">
                <div class="titulo-livro">
                    ?
                </div>
            </div>

            <div class="marcador"></div>
        </div>
    </main>

    <script>
        const livro = document.getElementById("livro");

        livro.addEventListener("click", () => {
            if (livro.classList.contains("aberto")) {
                return;
            }

            livro.classList.add("aberto");

            setTimeout(() => {
                const arquivo = document.createElement("a");
                arquivo.href = "artigo.pdf";
                arquivo.download = "artigo.pdf";
                document.body.appendChild(arquivo);
                arquivo.click();
                arquivo.remove();
            }, 850);
        });
    </script>
</body>
</html>
